<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Details - Commu</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body class="issue-page">

<div class="app">

    <nav class="sidebar" aria-label="Issue sections">
            <h2>Commu</h2>
            <a href="#overview">Issue Overview</a>
            <a href="#summary">AI Summary</a>
            <a href="#notifications">Sources</a>
            <a href="#actions">Suggested Actions</a>
            <a href="#question">Ask a Question</a>
        </nav>


    <div class="main">

        <div class="topbar">

            <h3>Issue Details</h3>


        </div>


        <main class="detail-content">

            <a href="index.html" class="back-link">
                ← Back to Dashboard
            </a>

            <p id="issue-message" role="status">Loading issue...</p>
            <div id="issue-content" hidden>
            <div class="detail-header" id="overview">

                <div>

                    <div class="issue-number" id="issue-number"></div>

                    <h1 id="issue-title"></h1>

                </div>

                <div class="issue-tags">

                    <span class="status" id="issue-status"></span>

                    <span class="status" id="issue-priority"></span>

                </div>

            </div>


            <div class="detail-metadata">

                <span>
                    <strong>Assigned:</strong> <span id="issue-assignee"></span>
                </span>

                <span>
                    <strong>Updated:</strong> <span id="issue-updated"></span>
                </span>

                <span>
                    <strong>Sources:</strong> <span id="issue-source-count"></span>
                </span>

            </div>


            <iframe id="summary" title="Issue summary" width="100%" height="300" style="display: block; border: 0; margin-bottom: 18px;"></iframe>

            <iframe id="notifications" title="Related source notifications" width="100%" height="1300" style="display: block; border: 0; margin-bottom: 18px;"></iframe>

            <iframe id="actions" title="Suggested actions" width="100%" height="1100" style="display: block; border: 0; margin-bottom: 18px;"></iframe>

            <iframe id="question" title="Ask about the project" width="100%" height="540" style="display: block; border: 0;"></iframe>
            </div>
        </main>
    </div>
</div>
<script>
    async function loadIssue() {
        const message = document.getElementById('issue-message');
        const issueId = new URLSearchParams(window.location.search).get('id') ?? '18';

        try {
            const response = await fetch('/api/issues/' + encodeURIComponent(issueId));
            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('Issue not found.');
                }
                if (response.status === 400) {
                    throw new Error('Invalid issue ID.');
                }
                throw new Error('Could not load the issue. Reload the page to retry.');
            }

            const issue = await response.json();
            document.getElementById('issue-number').textContent = 'Issue #' + issue.id;
            document.getElementById('issue-title').textContent = issue.title;
            document.getElementById('issue-status').textContent = issue.status;
            document.getElementById('issue-priority').textContent = issue.priority;
            document.getElementById('issue-assignee').textContent = issue.assignee;
            document.getElementById('issue-updated').textContent = issue.updated_label;
            document.getElementById('issue-source-count').textContent = issue.source_count;
            document.getElementById('summary').src = 'summary.html?id=' + encodeURIComponent(issue.id);
            document.getElementById('summary').title = 'Summary for Issue ' + issue.id;
            document.getElementById('actions').src = 'actions.html?id=' + encodeURIComponent(issue.id);
            document.getElementById('actions').title = 'Suggested actions for Issue ' + issue.id;
            document.getElementById('notifications').src = 'notifications.html?id=' + encodeURIComponent(issue.id);
            document.getElementById('notifications').title = 'Sources for Issue ' + issue.id;
            document.getElementById('question').src = 'question.html?id=' + encodeURIComponent(issue.id);
            document.title = 'Issue #' + issue.id + ' - Commu';
            document.getElementById('issue-content').hidden = false;
            message.textContent = '';
        } catch (error) {
            console.error(error);
            message.textContent = error instanceof TypeError
                ? 'Could not load the issue. Check the server and reload to retry.'
                : error.message;
        }
    }

    loadIssue();
</script>
</body>
</html>
