<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commu</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app">

        <nav class="sidebar" aria-label="Main navigation">
            <h2>Commu</h2>
            <a href="index.html" aria-current="page">Project #1</a>
            <a href="index.html" aria-current="page">Project #2</a>
        </nav>


        <div class="main">

            <div class="topbar">

                <h3>Project Dashboard</h3>

                <div class="sources">

                    <div class="source-button">
                        Sources
                    </div>

                </div>

            </div>


            <main class="content" id="issues">

                <div class="page-header">

                    <h1>Current Issues</h1>
                    <p>Quick summaries of active project issues.</p>

                </div>


                <a class="issue-card" href="issue.html?id=18" aria-labelledby="issue-18-title">

                    <div class="issue-header">

                        <div>

                            <div class="issue-number">
                                Issue #18
                            </div>

                            <h2 class="issue-title" id="issue-18-title">
                                Dashboard not loading repository data
                            </h2>

                        </div>


                        <div class="issue-tags">

                            <span class="status">
                                Open
                            </span>

                            <span class="status">
                                High Priority
                            </span>

                        </div>

                    </div>


                    <div class="summary">

                        <strong>AI Summary</strong>

                        <p id="issue-18-summary" role="status">Loading summary...</p>

                    </div>


                    <div class="source-counts">

                        <div class="source-count">
                            GitHub
                            <strong>2</strong>
                        </div>

                        <div class="source-count">
                            Slack
                            <strong>5</strong>
                        </div>

                        <div class="source-count">
                            Email
                            <strong>1</strong>
                        </div>

                    </div>


                    <div class="issue-footer">

                        <div class="metadata">

                            <span>
                                Assigned: Alex
                            </span>

                            <span>
                                Updated: Today
                            </span>

                        </div>

                    </div>

                </a>
            </main>
        </div>
    </div>
    <script>
        async function loadDashboardSummary() {
            const summary = document.getElementById('issue-18-summary');
            try {
                const response = await fetch('/api/issues/18/summary');
                if (!response.ok) {
                    throw new Error('Could not load the summary.');
                }
                const data = await response.json();
                summary.textContent = data ? data.dashboard_text : 'No summary available for this issue.';
            } catch (error) {
                console.error(error);
                summary.textContent = 'Could not load the summary. Reload the page to retry.';
            }
        }

        loadDashboardSummary();
    </script>
</body>
</html>
