<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Commu</title>

    <link rel="stylesheet" href="styles.css">
    <script src="ui.js" defer></script>
</head>

<body>

    <div class="app">

        <nav class="sidebar" aria-label="Main navigation">
            <h2>Commu</h2>
            <div id="project-links"></div>
        </nav>


        <div class="main">

            <div class="topbar">

                <h3>Project Dashboard</h3>

                <div class="sources">

                    <div class="source-button">
                        Sources
                    </div>

                </div>

            </div>


            <main class="content" id="issues">

                <div class="page-header">

                    <h1 id="project-heading">Current Issues</h1>
                    <p>Quick summaries of active project issues.</p>

                </div>


                <p id="dashboard-message" role="status">Loading projects...</p>
                <div id="issue-list"></div>
                <template id="issue-template">
                    <a class="issue-card">
                        <div class="issue-header">
                            <div><div class="issue-number"></div><h2 class="issue-title"></h2></div>
                            <div class="issue-tags"><span class="status" data-field="status"></span><span class="status" data-field="priority"></span></div>
                        </div>
                        <div class="summary"><strong>AI Summary</strong><p></p></div>
                        <div class="source-counts">
                            <div class="source-count">GitHub <strong data-field="github_count"></strong></div>
                            <div class="source-count">Slack <strong data-field="slack_count"></strong></div>
                            <div class="source-count">Email <strong data-field="email_count"></strong></div>
                        </div>
                        <div class="issue-footer"><div class="metadata"><span data-field="assignee"></span><span data-field="updated_label"></span></div></div>
                    </a>
                </template>
            </main>
        </div>
    </div>
    <script>
        async function getJson(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error('Could not load dashboard data.');
            return response.json();
        }

        function renderIssue(issue) {
            const card = document.getElementById('issue-template').content.firstElementChild.cloneNode(true);
            card.href = 'issue.html?id=' + encodeURIComponent(issue.id);
            const title = card.querySelector('.issue-title');
            title.id = 'issue-' + issue.id + '-title';
            title.textContent = issue.title;
            card.setAttribute('aria-labelledby', title.id);
            card.querySelector('.issue-number').textContent = 'Issue #' + issue.id;
            card.querySelector('.summary p').textContent = issue.dashboard_text || 'No summary available.';
            ['status', 'priority', 'github_count', 'slack_count', 'email_count'].forEach(function (field) {
                card.querySelector('[data-field="' + field + '"]').textContent = issue[field];
            });
            card.querySelector('[data-field="assignee"]').textContent = 'Assigned: ' + issue.assignee;
            card.querySelector('[data-field="updated_label"]').textContent = 'Updated: ' + issue.updated_label;
            return card;
        }

        async function loadDashboard() {
            const message = document.getElementById('dashboard-message');
            try {
                const projects = await getJson('/api/projects');
                const requestedId = new URLSearchParams(location.search).get('project');
                const selected = requestedId === null
                    ? projects[0]
                    : projects.find(function (project) { return String(project.id) === requestedId; });
                const links = document.getElementById('project-links');
                projects.forEach(function (project) {
                    const link = document.createElement('a');
                    link.href = 'index.html?project=' + encodeURIComponent(project.id);
                    link.textContent = project.name;
                    if (selected && selected.id === project.id) link.setAttribute('aria-current', 'page');
                    links.append(link);
                });
                if (!projects.length) {
                    message.textContent = 'No projects available.';
                    return;
                }
                if (!selected) {
                    message.textContent = 'Project not found. Choose a project from the sidebar.';
                    return;
                }
                document.getElementById('project-heading').textContent = selected.name + ' — Current Issues';
                document.title = selected.name + ' - Commu';
                message.textContent = 'Loading issues...';
                const issues = await getJson('/api/projects/' + encodeURIComponent(selected.id) + '/issues');
                document.getElementById('issue-list').replaceChildren(...issues.map(renderIssue));
                message.textContent = issues.length ? '' : 'No issues available for this project.';
            } catch (error) {
                console.error(error);
                message.textContent = 'Could not load the dashboard. Check the server and reload to retry.';
            }
        }

        loadDashboard();
    </script>
</body>
</html>
