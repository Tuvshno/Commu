<!DOCTYPE html>
<head>
    <title>Commu question component</title>
    <style>
        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #292929;
            background: transparent;
        }


        .mock-note {
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }


        :focus-visible {
            outline: 2px solid #555;
            outline-offset: 3px;
        }


        /* Question prompt below the issues */
        .ask-question {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
            margin-top: 24px;
        }


        .ask-question h2 {
            margin-top: 0;
            font-size: 20px;
        }


        .ask-question p {
            line-height: 1.5;
        }


        .chat-messages {
            max-height: 360px;
            overflow-y: auto;
            overflow-wrap: anywhere;
        }


        .chat-exchange {
            border-top: 1px solid #ddd;
            padding: 16px 0;
        }


        .chat-exchange p {
            margin: 8px 0 16px;
            white-space: pre-wrap;
        }


        .chat-exchange a {
            color: #333;
        }


        .question-form {
            margin-top: 16px;
        }


        .question-form label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
        }


        .question-input-row {
            display: flex;
            gap: 10px;
        }


        .question-input-row input {
            flex: 1;
            min-width: 0;
            border: 1px solid #aaa;
            padding: 12px;
            font: inherit;
        }


        .question-input-row button {
            border: 1px solid #aaa;
            background: #eee;
            padding: 10px 18px;
            font: inherit;
            cursor: pointer;
        }


        .question-input-row button:hover {
            background: #ddd;
        }


        @media (max-width: 480px) {
            .question-input-row {
                flex-direction: column;
            }
        }


        .ask-question {
            margin-top: 0;
        }


        .chat-messages {
            max-height: 180px;
        }
    </style>
</head>


<body>
    <section class="ask-question" aria-labelledby="ask-heading">
        <h2 id="ask-heading">Ask about the project</h2>
        <p id="ask-note">This demo returns the same saved sample answer for any question. It does not generate an AI response.</p>
        <div id="chat-messages" class="chat-messages" role="log" aria-label="Questions and sample answers"
            aria-live="polite" aria-relevant="additions"></div>


        <form id="question-form" class="question-form">
            <label for="project-question">Your question</label>
            <div class="question-input-row">
                <input id="project-question" name="question" type="text"
                    placeholder="Ask a question about this issue" maxlength="500"
                    aria-describedby="ask-note" required>
                <button type="submit">Send</button>
            </div>
        </form>
        <p id="question-status" role="status"></p>
    </section>
    <script>
        const questionForm = document.getElementById('question-form');
        const questionInput = document.getElementById('project-question');
        const chatMessages = document.getElementById('chat-messages');
        const status = document.getElementById('question-status');
        const sendButton = questionForm.querySelector('button');
        const issueId = new URLSearchParams(window.location.search).get('id') ?? '18';


        questionForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            const question = questionInput.value.trim();
            if (!question) {
                status.textContent = 'Enter a question before sending.';
                questionInput.focus();
                return;
            }


            sendButton.disabled = true;
            status.textContent = 'Loading sample answer...';
            try {
                const response = await fetch('/api/issues/' + encodeURIComponent(issueId) + '/questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Could not load a sample answer.');
                }
                const sample = await response.json();
                showExchange(question, sample);
                questionInput.value = '';
                status.textContent = '';
            } catch (error) {
                console.error(error);
                status.textContent = error instanceof TypeError
                    ? 'Could not reach the server. Please try again.'
                    : error.message;
            } finally {
                sendButton.disabled = false;
                questionInput.focus();
            }
        });


        function showExchange(question, sample) {
            const exchange = document.createElement('div');
            exchange.className = 'chat-exchange';


            const questionLabel = document.createElement('strong');
            questionLabel.textContent = 'You';
            const questionText = document.createElement('p');
            questionText.textContent = question;


            const answerLabel = document.createElement('strong');
            answerLabel.textContent = sample.answer_label;
            const answer = document.createElement('p');
            answer.textContent = sample.answer_text;


            const sources = document.createElement('p');
            sources.className = 'mock-note';
            sources.textContent = sample.references_text;
            const detailLink = document.createElement('a');
            exchange.append(questionLabel, questionText, answerLabel, answer, sources);
            try {
                const url = new URL(sample.link_url, window.location.href);
                if (url.protocol !== 'http:' && url.protocol !== 'https:') {
                    throw new Error('Unsupported sample link protocol.');
                }
                detailLink.href = url.href;
                detailLink.target = '_top';
                detailLink.textContent = sample.link_label;
                exchange.append(detailLink);
            } catch (error) {
                console.error(error);
                const warning = document.createElement('p');
                warning.textContent = 'Sample reference link unavailable.';
                exchange.append(warning);
            }
            chatMessages.append(exchange);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }


    </script>
</body>


</html>
