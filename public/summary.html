<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commu issue summary</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; color: #292929; background: transparent; }
        .detail-section { background: white; border: 1px solid #ccc; padding: 20px; }
        h2 { margin-top: 0; }
        p { line-height: 1.6; }
        #summary-text { white-space: pre-line; }
    </style>
</head>
<body>
    <main aria-label="Issue summary">
        <section class="detail-section">

                <h2>AI Summary</h2>

                <p id="summary-text" role="status">Loading summary...</p>

            </section>
    </main>
    <script>
        async function loadSummary() {
            const text = document.getElementById('summary-text');
            const issueId = new URLSearchParams(window.location.search).get('id') ?? '18';
            try {
                const response = await fetch('/api/issues/' + encodeURIComponent(issueId) + '/summary');
                if (!response.ok) {
                    if (response.status === 400) throw new Error('Invalid issue ID.');
                    if (response.status === 404) throw new Error('Issue not found.');
                    throw new Error('Could not load the summary. Reload the page to retry.');
                }
                const summary = await response.json();
                text.textContent = summary && summary.detail_text
                    ? summary.detail_text
                    : 'No detailed summary available for this issue.';
            } catch (error) {
                console.error(error);
                text.textContent = error instanceof TypeError
                    ? 'Could not load the summary. Check the server and reload to retry.'
                    : error.message;
            }
        }

        loadSummary();
    </script>
</body>
</html>
