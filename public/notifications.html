<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commu source notifications</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #292929;
            background: transparent;
        }

        .detail-section {
            background: white;
            border: 1px solid #ccc;
            padding: 20px;
            margin-bottom: 18px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .section-header h2 {
            margin: 0;
        }

        .source-total {
            font-size: 13px;
            color: #666;
        }

        .detail-item {
            background: #f7f7f7;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
        }

        .detail-item:last-child {
            margin-bottom: 0;
        }

        p {
            line-height: 1.6;
        }

        a {
            color: #333;
        }

        .message {
            border-bottom: 1px solid #ddd;
            padding: 12px 5px;
        }

        .message:last-child {
            border-bottom: none;
        }

        .message p {
            margin-bottom: 5px;
        }

        .message-time {
            margin-left: 8px;
            color: #888;
            font-size: 12px;
        }

        .email-info {
            color: #666;
            font-size: 13px;
        }

        .status-message {
            color: #666;
            font-size: 14px;
            padding: 10px 0;
        }

        :focus-visible {
            outline: 2px solid #555;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <!-- Sections are no longer hardcoded: they are built from the database via the API -->
    <main id="notifications" aria-label="Related source notifications">
        <p class="status-message">Loading notifications...</p>
    </main>

    <script>
        // Issue id comes from the URL, e.g. notifications.html?id=18
        // (falls back to 18 so the page still works when opened on its own)
        const issueId = new URLSearchParams(window.location.search).get('id') || '18';

        // Escape text coming from the database before putting it in HTML
        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function link(item) {
            if (!item.link_url) return '';
            return `<a href="${esc(item.link_url)}">${esc(item.link_label || 'View')}</a>`;
        }

        // One renderer per source so each keeps its original look
        const renderers = {
            GitHub: item => `
                <div class="detail-item">
                    <strong>${esc(item.title)}</strong>
                    <p>${esc(item.body)}</p>
                    ${link(item)}
                </div>`,

            Slack: item => `
                <div class="message">
                    <strong>${esc(item.author)}</strong>
                    <span class="message-time">${esc(item.time_label)}</span>
                    <p>${esc(item.body)}</p>
                </div>`,

            Email: item => `
                <div class="detail-item">
                    <strong>${esc(item.title)}</strong>
                    <p class="email-info">From: ${esc(item.author)}</p>
                    <p>${esc(item.body)}</p>
                </div>`
        };

        function renderGroup(group) {
            const render = renderers[group.source] || renderers.GitHub;
            const items = group.items.length
                ? group.items.map(render).join('')
                : '<p class="status-message">No related items.</p>';

            return `
                <section class="detail-section">
                    <div class="section-header">
                        <h2>${esc(group.source)}</h2>
                        <span class="source-total">${esc(group.totalLabel)}</span>
                    </div>
                    ${items}
                </section>`;
        }

        const root = document.getElementById('notifications');

        fetch(`/api/issues/${encodeURIComponent(issueId)}/notifications`)
            .then(response => {
                if (!response.ok) throw new Error(`Request failed: ${response.status}`);
                return response.json();
            })
            .then(groups => {
                root.innerHTML = groups.map(renderGroup).join('');
            })
            .catch(error => {
                console.error(error);
                root.innerHTML = '<p class="status-message">Could not load notifications.</p>';
            });
    </script>
</body>

</html>
