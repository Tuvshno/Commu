<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commu suggested actions</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #292929;
            background: transparent;
        }

        main {
            padding: 20px;
            border: 1px solid #ccc;
            background: white;
        }

        h2 {
            margin-top: 0;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 16px;
        }

        p {
            line-height: 1.5;
        }

        .note,
        .evidence {
            color: #666;
            font-size: 13px;
        }

        .action {
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #ddd;
            background: #fafafa;
        }

        .action p {
            margin: 10px 0;
        }

        .preview {
            background: white;
            border-left: 3px solid #ccc;
            padding: 10px 12px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            font: inherit;
            padding: 8px 14px;
            border: 1px solid #aaa;
            background: #eee;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }

        button:disabled {
            cursor: default;
            color: #777;
            background: #f3f3f3;
        }

        :focus-visible {
            outline: 2px solid #555;
            outline-offset: 3px;
        }

        .result {
            font-size: 14px;
        }

        .result:empty {
            margin: 0;
        }
    </style>
</head>

<body>
    <main aria-labelledby="actions-heading">
        <h2 id="actions-heading">Sample Suggested Actions</h2>
        <p>Review each sample action, then confirm or deny it.</p>
        <p class="note">Decisions are saved locally. No GitHub task, Slack message, or email is sent.</p>
        <p id="actions-message" role="status">Loading suggested actions...</p>
        <div id="actions-list"></div>
    </main>
    <script>
        function createAction(item, index) {
            const action = document.createElement('section');
            action.className = 'action';
            action.dataset.actionId = item.action_id;

            const heading = document.createElement('h3');
            heading.textContent = (index + 1) + '. ' + item.title;
            const description = document.createElement('p');
            description.textContent = item.description;
            const evidence = document.createElement('p');
            evidence.className = 'evidence';
            evidence.textContent = item.evidence;
            const preview = document.createElement('p');
            preview.className = 'preview';
            const previewLabel = document.createElement('strong');
            previewLabel.textContent = item.preview_label;
            preview.append(previewLabel, document.createTextNode(' ' + item.preview_text));
            const buttons = document.createElement('div');
            buttons.className = 'buttons';
            const confirm = document.createElement('button');
            confirm.type = 'button';
            confirm.dataset.decision = 'confirm';
            confirm.textContent = item.confirm_label;
            const deny = document.createElement('button');
            deny.type = 'button';
            deny.dataset.decision = 'deny';
            deny.textContent = 'Deny';
            buttons.append(confirm, deny);
            const result = document.createElement('p');
            result.className = 'result';
            result.setAttribute('role', 'status');
            result.tabIndex = -1;
            action.append(heading, description, evidence, preview, buttons, result);
            return action;
        }

        function setupAction(action) {
            const actionId = action.dataset.actionId;
            const buttons = action.querySelectorAll('button');
            const result = action.querySelector('.result');
            const url = '/api/actions/' + encodeURIComponent(actionId);

            function setButtonsDisabled(disabled) {
                buttons.forEach(function (button) {
                    button.disabled = disabled;
                });
            }

            function showDecision(decision) {
                result.textContent = decision === 'confirmed'
                    ? 'Confirmed and saved. No external action was performed.'
                    : 'Denied and saved. No external action was performed.';
                setButtonsDisabled(true);
            }

            async function loadDecision() {
                setButtonsDisabled(true);
                result.textContent = 'Loading saved decision...';

                try {
                    const response = await fetch(url);
                    if (!response.ok) {
                        throw new Error('Could not load the decision.');
                    }

                    const saved = await response.json();
                    if (saved) {
                        showDecision(saved.decision);
                    } else {
                        result.textContent = '';
                        setButtonsDisabled(false);
                    }
                } catch (error) {
                    console.error(error);
                    result.textContent = 'Could not load the decision. Reload the page to retry.';
                }
            }

            buttons.forEach(function (button) {
                button.addEventListener('click', async function () {
                    const decision = button.dataset.decision === 'confirm'
                        ? 'confirmed'
                        : 'denied';

                    setButtonsDisabled(true);
                    result.textContent = 'Saving decision...';

                    try {
                        const response = await fetch(url, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ decision })
                        });

                        if (!response.ok) {
                            throw new Error('Could not save the decision.');
                        }

                        const saved = await response.json();
                        showDecision(saved.decision);
                    } catch (error) {
                        console.error(error);
                        result.textContent = 'Could not save the decision. Please try again.';
                        setButtonsDisabled(false);
                    }
                    result.focus();
                });
            });

            loadDecision();
        }

        async function loadActions() {
            const message = document.getElementById('actions-message');
            const list = document.getElementById('actions-list');
            const issueId = new URLSearchParams(window.location.search).get('id') ?? '18';

            try {
                const response = await fetch('/api/issues/' + encodeURIComponent(issueId) + '/actions');
                if (!response.ok) {
                    throw new Error('Could not load suggested actions.');
                }
                const actions = await response.json();
                message.textContent = actions.length ? '' : 'No suggested actions for this issue.';
                actions.forEach(function (item, index) {
                    const action = createAction(item, index);
                    list.append(action);
                    setupAction(action);
                });
            } catch (error) {
                console.error(error);
                message.textContent = 'Could not load suggested actions. Reload the page to retry.';
            }
        }

        loadActions();
    </script>
</body>

</html>
